<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090817">
<title>Yolanda Tangani | Cyber Queen — Level 31</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Orbitron:wght@500;600;700;800&display=swap');
:root{--bg:#090817;--panel:#121127;--purple:#a78bfa;--pink:#f0abfc;--cyan:#67e8f9;--muted:#b9b5d0;--white:#f8f7ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 50% -10%,#30205b 0%,transparent 45%),var(--bg);color:var(--white);font-family:'DM Sans',sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(rgba(167,139,250,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(167,139,250,.12) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,black,transparent 80%);z-index:-1}
a{color:inherit;text-decoration:none}.wrap{width:min(1100px,92%);margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0}.brand{font:700 13px Orbitron,sans-serif;letter-spacing:2px;color:var(--pink)}.status{font-size:11px;letter-spacing:1.5px;color:#86efac;border:1px solid #245c49;border-radius:99px;padding:8px 12px}
.hero{min-height:690px;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:42px;padding:48px 0 80px}.eyebrow{color:var(--cyan);font:600 11px Orbitron,sans-serif;letter-spacing:3px}.hero h1{font:800 clamp(42px,7vw,78px)/1.04 Orbitron,sans-serif;margin:18px 0 12px;letter-spacing:-3px}.hero h1 span{display:block;background:linear-gradient(90deg,var(--purple),var(--pink),var(--cyan));background-clip:text;color:transparent}.sub{font-size:18px;color:var(--muted);line-height:1.7;max-width:540px}.date{display:inline-flex;gap:10px;align-items:center;margin:20px 0;padding:12px 16px;border:1px solid #5b478a;background:#17132c;border-radius:12px;color:#eadcff}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;transition:.2s}.primary{background:linear-gradient(100deg,#9b75f5,#dc8eea);color:#160d29;box-shadow:0 8px 28px #a78bfa33}.secondary{background:#19172d;color:var(--white);border:1px solid #51446e}.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.portrait-card{position:relative;max-width:430px;width:100%;margin:auto;padding:12px;border:1px solid #7860aa;border-radius:26px;background:linear-gradient(145deg,#292044,#111022);box-shadow:0 25px 90px #9b75f533}.portrait{height:440px;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#583b80,#17152d 65%);position:relative}.portrait img{width:100%;height:100%;object-fit:cover;display:none}.placeholder{padding:24px;color:#e7d9ff}.placeholder .symbol{font:800 82px Orbitron,sans-serif;color:#e6caff;text-shadow:0 0 35px #c084fc}.placeholder p{line-height:1.6;color:#d4c6ed}.upload{display:inline-block;margin-top:8px;font-size:13px;color:var(--cyan);text-decoration:underline;cursor:pointer}.corner{position:absolute;background:#100e20;border:1px solid #765ca9;border-radius:10px;padding:9px 12px;font:600 10px Orbitron,sans-serif;letter-spacing:1px}.corner.top{top:25px;left:-20px}.corner.bottom{bottom:25px;right:-20px}
.section{padding:68px 0}.section-title{text-align:center;font:700 clamp(24px,4vw,36px) Orbitron,sans-serif;margin:0 0 12px}.section-lead{text-align:center;color:var(--muted);max-width:650px;margin:0 auto 34px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.tile{padding:24px;border-radius:18px;border:1px solid #34294f;background:linear-gradient(145deg,#17142c,#100f20)}.tile .icon{font-size:27px}.tile h3{font:600 15px Orbitron,sans-serif;color:#e9d5ff}.tile p{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:0}
.countbox{max-width:760px;margin:auto;padding:30px;border:1px solid #59447f;border-radius:22px;background:linear-gradient(135deg,#1b1633,#101020);text-align:center}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}.time{padding:18px 8px;border-radius:14px;background:#0c0b19;border:1px solid #382b54}.time strong{display:block;font:700 clamp(25px,5vw,42px) Orbitron,sans-serif;color:var(--pink)}.time span{font-size:10px;letter-spacing:1.5px;color:var(--muted)}
.message{max-width:780px;margin:auto;text-align:center;padding:34px;border-radius:22px;background:radial-gradient(circle at top,#30204d,#121126 65%);border:1px solid #57417c}.message p{font-size:17px;line-height:1.9;color:#e3dced}.signature{font:600 13px Orbitron,sans-serif;color:var(--pink);letter-spacing:2px}
footer{text-align:center;padding:35px 15px;color:#8e88a8;font-size:12px;border-top:1px solid #28213e}.glow{color:var(--cyan)}.hidden{display:none!important}
@media(max-width:780px){.hero{grid-template-columns:1fr;padding-top:28px;gap:35px;text-align:center}.sub{margin:auto}.actions{justify-content:center}.portrait-card{max-width:360px}.portrait{height:370px}.corner.top{left:-8px}.corner.bottom{right:-8px}.grid{grid-template-columns:1fr}.section{padding:52px 0}.countbox{padding:22px 14px}}
@media(max-width:420px){.countdown{gap:6px}.time{padding:14px 4px}.time span{font-size:8px}.hero h1{letter-spacing:-2px}}

.reveal-later[hidden]{display:none!important}
body.birthday-mode .reveal-later[hidden]{display:block!important}
.celebration-banner{display:none;margin:8px auto 0;padding:24px 18px;text-align:center;border:1px solid #8060aa;border-radius:20px;background:radial-gradient(circle at 50% 0%,#4a2c70,#17132c 72%);box-shadow:0 12px 50px #a78bfa22}
body.birthday-mode .celebration-banner{display:block;animation:popIn .9s ease both}
.celebration-banner h2{font:800 clamp(26px,5vw,48px)/1.2 Orbitron,sans-serif;margin:8px 0;background:linear-gradient(90deg,#f5d6a0,#f0abfc,#67e8f9);background-clip:text;color:transparent}
.celebration-banner p{color:#e4d9f5;margin:8px 0 0}
body.birthday-mode #contagem .countbox{border-color:#a77ad2}
body.birthday-mode #countLabel{font-weight:700;color:#f5d6a0}
.confetti-piece{position:fixed;top:-14px;width:8px;height:13px;z-index:9999;pointer-events:none;opacity:.95;animation:confettiFall 5.5s linear forwards}
@keyframes confettiFall{to{transform:translate3d(var(--drift),110vh,0) rotate(900deg);opacity:.1}}
@keyframes popIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}


/* Layout vertical inspirado no exemplo enviado */
.hero.screenshot-layout{display:block;min-height:0;padding:26px 0 58px;text-align:center}
.countdown-card{width:min(650px,100%);margin:0 auto;padding:30px 24px 26px;border-radius:28px;background:#0b0a1b;border:1px solid #29203f;box-shadow:0 22px 75px #0007}
.countdown-card>.eyebrow{display:inline-block;padding:8px 13px;border-radius:99px;background:#111d3c;color:#60a5fa;font-size:12px;letter-spacing:1.5px}
.yolanda-name{font:600 clamp(28px,6vw,48px)/1.2 'DM Sans',sans-serif;letter-spacing:.3px;margin:26px 0 16px;color:#e9c9ff}
.level-label{font:500 clamp(28px,5vw,42px) 'DM Sans',sans-serif;margin:0 0 24px;color:#fff}
.screenshot-portrait{max-width:100%;padding:0;margin:0 auto 22px;border:1px solid #33244f;background:#151128;border-radius:18px;box-shadow:none}
.screenshot-portrait .portrait{height:clamp(260px,55vw,390px);border-radius:17px;background:#17132a}
.screenshot-portrait .portrait img{display:block!important;width:100%;height:100%;object-fit:cover;object-position:center 38%}
.screenshot-portrait .placeholder,.screenshot-portrait .corner{display:none!important}
.coming-soon{font:600 clamp(20px,4vw,34px)/1.5 'DM Sans',sans-serif;color:#e9a9f5;margin:22px auto 24px;max-width:520px}
.countdown-section{display:block!important;max-width:100%;margin:0 auto}
.countdown-section .countdown{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
.countdown-section .time{background:#211a38;border:0;border-radius:14px;padding:18px 5px}
.countdown-section .time strong{font:600 clamp(24px,5vw,34px) 'DM Sans',sans-serif;color:#fff}
.countdown-section .time span{font:400 12px 'DM Sans',sans-serif;color:#aaa3c2;letter-spacing:0}
.count-label{color:#aaa3c2;margin:24px 0 26px;font-size:16px}
.countdown-section .date{display:block;margin:0;border:0;background:none;padding:0;color:#e9a9f5;font-weight:600;font-size:20px}
body.birthday-mode .coming-soon,body.birthday-mode .countdown-section{display:none!important}
body.birthday-mode .countdown-card{border-color:#79559d;box-shadow:0 22px 85px #a78bfa22}
@media(max-width:480px){.countdown-card{padding:24px 15px 22px;border-radius:22px}.countdown-section .countdown{gap:7px}.countdown-section .time{padding:15px 3px}.countdown-section .time span{font-size:10px}.screenshot-portrait .portrait{height:310px}}


.special-message-btn{display:block;margin:24px auto 0;max-width:360px;width:100%;font:700 13px 'DM Sans',sans-serif;letter-spacing:.5px}
.locked-note{max-width:430px;margin:14px auto 0;padding:13px 15px;border:1px solid #6b5488;border-radius:12px;background:#211a38;color:#f1d7ff;font-size:13px;line-height:1.6;animation:popIn .25s ease both}
.locked-note[hidden]{display:none}
body.birthday-mode .special-message-btn{margin-top:22px}

</style>
</head>
